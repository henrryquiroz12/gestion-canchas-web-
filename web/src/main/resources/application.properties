
spring.application.name=web
# BASE DE DATOS
spring.datasource.url=jdbc:mysql://${FQS_DB_HOST:127.0.0.1}:${FQS_DB_PORT:3306}/${FQS_DB_NAME:canchas_web}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${FQS_DB_USERNAME:root}
spring.datasource.password=${FQS_DB_PASSWORD:alumno}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ENCODING & THYMELEAF
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.endpoint.health.roles=ADMIN

# ADMINISTRADOR INICIAL (DEMO LOCAL)
fqs.admin.username=${FQS_ADMIN_USERNAME:Mark2026}
fqs.admin.password=${FQS_ADMIN_PASSWORD:Proyectoweb2026}
fqs.admin.email=${FQS_ADMIN_EMAIL:mark2026@fredyqueensoccer.com}
server.port=${FQS_SERVER_PORT:8081}

# Additive schema initialization runs before Hibernate's existing schema validation.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/retenciones-horario.sql
fqs.reservation-hold.minutes=${FQS_RESERVATION_HOLD_MINUTES:15}
