<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Rol - Fredy Queen Soccer</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <style>
        .fqs-role-selector-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #F8FAFC;
        }

        .fqs-role-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .fqs-role-card {
            background: #FFFFFF;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
            border: 1px solid #E2E8F0;
            padding: 3.5rem 3rem;
            max-width: 820px;
            width: 100%;
            text-align: center;
        }

        .fqs-role-title {
            font-size: 2rem;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .fqs-role-subtitle {
            color: #64748B;
            font-size: 1rem;
            margin-bottom: 3.5rem;
        }

        .fqs-role-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4rem;
            flex-wrap: wrap;
        }

        .fqs-role-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease-in-out;
            position: relative;
        }

        .fqs-role-circle-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid #64748B;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 16px -2px rgba(15, 23, 42, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .fqs-role-circle-container svg {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .fqs-role-name {
            margin-top: 1.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: #1E293B;
            transition: color 0.2s ease;
        }

        .fqs-role-description {
            font-size: 0.85rem;
            color: #64748B;
            margin-top: 0.25rem;
        }

        /* Hover States */
        .fqs-role-option:hover .fqs-role-circle-container,
        .fqs-role-option:focus-visible .fqs-role-circle-container {
            border-color: #059669;
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 30px -8px rgba(5, 150, 105, 0.25);
        }

        .fqs-role-option:hover .fqs-role-circle-container svg {
            transform: scale(1.05);
        }

        .fqs-role-option:hover .fqs-role-name {
            color: #059669;
        }

        /* Active highlight if current role */
        .fqs-role-option.is-active .fqs-role-circle-container {
            border-color: #10B981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }

        /* Disabled State if role not owned */
        .fqs-role-option.is-disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(80%);
        }

        .fqs-role-badge-active {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #059669;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
        }

        @media (max-width: 640px) {
            .fqs-role-card {
                padding: 2rem 1.5rem;
            }
            .fqs-role-grid {
                gap: 2.5rem;
            }
            .fqs-role-circle-container {
                width: 160px;
                height: 160px;
            }
            .fqs-role-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="fqs-role-selector-page">

    <!-- Navbar estándar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="fqs-role-wrapper" id="main-content">
        <div class="fqs-role-card">
            <h1 class="fqs-role-title">¿Con qué rol deseas ingresar?</h1>
            <p class="fqs-role-subtitle">
                Hola <strong th:text="${usuario.fullName != null and !usuario.fullName.isBlank() ? usuario.fullName : usuario.username}">Usuario</strong>, selecciona el perfil de acceso para esta sesión:
            </p>

            <div class="fqs-role-grid">
                <!-- OPCIÓN 1: ADMINISTRADOR (Sin letra A) -->
                <a th:href="@{/seleccionar-rol/admin}" 
                   class="fqs-role-option" 
                   th:classappend="${!tieneRolAdmin} ? 'is-disabled' : ''"
                   aria-label="Ingresar como Administrador">
                    <div class="fqs-role-circle-container">
                        <!-- SVG Ilustración Profesional Administrador (Estilo dibujo como en la captura) -->
                        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <!-- Fondo suave -->
                            <circle cx="100" cy="100" r="95" fill="#F0F4F8"/>
                            <!-- Escritorio -->
                            <path d="M40 160 H160 V185 H40 Z" fill="#E2E8F0"/>
                            <rect x="75" y="150" width="50" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
                            <!-- Torso / Camisa lavanda/azul -->
                            <path d="M65 170 C65 130 80 120 100 120 C120 120 135 130 135 170 Z" fill="#7C8BA1"/>
                            <!-- Cuello de camisa blanca -->
                            <path d="M92 120 L100 132 L108 120 Z" fill="#FFFFFF"/>
                            <!-- Cuello -->
                            <rect x="94" y="105" width="12" height="18" fill="#F7C8A0"/>
                            <!-- Cabeza -->
                            <ellipse cx="100" cy="90" rx="22" ry="25" fill="#F7C8A0"/>
                            <!-- Cabello oscuro rizado con volumen -->
                            <path d="M78 88 C75 70 85 58 100 58 C115 58 125 70 122 88 C120 78 115 72 100 72 C85 72 80 78 78 88 Z" fill="#334155"/>
                            <circle cx="82" cy="74" r="8" fill="#334155"/>
                            <circle cx="94" cy="66" r="9" fill="#334155"/>
                            <circle cx="106" cy="66" r="9" fill="#334155"/>
                            <circle cx="118" cy="74" r="8" fill="#334155"/>
                            <!-- Orejas -->
                            <circle cx="78" cy="90" r="5" fill="#F7C8A0"/>
                            <circle cx="122" cy="90" r="5" fill="#F7C8A0"/>
                            <!-- Lentes oscuros característicos -->
                            <rect x="85" y="82" width="12" height="10" rx="2" fill="none" stroke="#1E293B" stroke-width="2.5"/>
                            <rect x="103" y="82" width="12" height="10" rx="2" fill="none" stroke="#1E293B" stroke-width="2.5"/>
                            <line x1="97" y1="87" x2="103" y2="87" stroke="#1E293B" stroke-width="2.5"/>
                            <!-- Ojos dentro de lentes -->
                            <circle cx="91" cy="87" r="2" fill="#1E293B"/>
                            <circle cx="109" cy="87" r="2" fill="#1E293B"/>
                            <!-- Nariz -->
                            <path d="M100 90 L98 96 H102" stroke="#E29D72" stroke-width="2" stroke-linecap="round"/>
                            <!-- Boca -->
                            <path d="M95 102 Q100 106 105 102" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <!-- Manos sobre la mesa -->
                            <ellipse cx="78" cy="155" rx="8" ry="6" fill="#F7C8A0"/>
                            <ellipse cx="122" cy="155" rx="8" ry="6" fill="#F7C8A0"/>
                        </svg>
                    </div>
                    <span class="fqs-role-name">Administrador</span>
                    <span class="fqs-role-description">Gestión global, canchas, reservas y reportes</span>
                </a>

                <!-- OPCIÓN 2: CLIENTE (Sin letra B) -->
                <a th:href="@{/seleccionar-rol/cliente}" 
                   class="fqs-role-option"
                   th:classappend="${!tieneRolCliente} ? 'is-disabled' : ''"
                   aria-label="Ingresar como Cliente">
                    <div class="fqs-role-circle-container">
                        <!-- SVG Ilustración Cliente (Estilo dibujo como en la captura) -->
                        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <!-- Fondo suave -->
                            <circle cx="100" cy="100" r="95" fill="#FEF3C7"/>
                            <!-- Laptop en escritorio -->
                            <path d="M68 152 H132 L138 168 H62 Z" fill="#94A3B8"/>
                            <rect x="74" y="125" width="52" height="30" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
                            <circle cx="100" cy="140" r="3" fill="#64748B"/>
                            <!-- Torso / Camiseta celeste-naranja -->
                            <path d="M68 170 C68 135 80 126 100 126 C120 126 132 135 132 170 Z" fill="#6EE7B7"/>
                            <!-- Cuello de camiseta -->
                            <path d="M93 126 Q100 134 107 126 Z" fill="#FDE68A"/>
                            <!-- Cuello -->
                            <rect x="94" y="112" width="12" height="15" fill="#F7C8A0"/>
                            <!-- Cabeza -->
                            <ellipse cx="100" cy="94" rx="21" ry="23" fill="#F7C8A0"/>
                            <!-- Cabello esponjado / afro castaño -->
                            <path d="M72 90 C68 70 78 54 100 54 C122 54 132 70 128 90 C135 105 125 125 122 125 C118 110 120 95 120 90 C120 75 110 66 100 66 C90 66 80 75 80 90 C80 95 82 110 78 125 C75 125 65 105 72 90 Z" fill="#334155"/>
                            <!-- Vincha / Diadema azul celeste -->
                            <path d="M79 82 C82 72 90 68 100 68 C110 68 118 72 121 82" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"/>
                            <!-- Orejas -->
                            <circle cx="79" cy="94" r="4.5" fill="#F7C8A0"/>
                            <circle cx="121" cy="94" r="4.5" fill="#F7C8A0"/>
                            <!-- Ojos sonrientes -->
                            <ellipse cx="92" cy="92" rx="2.5" ry="3" fill="#1E293B"/>
                            <ellipse cx="108" cy="92" rx="2.5" ry="3" fill="#1E293B"/>
                            <!-- Sonrisa abierta alegre -->
                            <path d="M93 103 Q100 112 107 103 Z" fill="#E11D48"/>
                            <!-- Brazos sobre laptop -->
                            <path d="M65 160 Q80 155 90 156" stroke="#F7C8A0" stroke-width="6" stroke-linecap="round"/>
                            <path d="M135 160 Q120 155 110 156" stroke="#F7C8A0" stroke-width="6" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="fqs-role-name">Cliente</span>
                    <span class="fqs-role-description">Reserva de canchas, torneos y perfil deportivo</span>
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script th:replace="~{fragments/layout :: navbar-js}"></script>
</body>
</html>
