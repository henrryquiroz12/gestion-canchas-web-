<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head-dashboard}"></head>
<body class="dashboard-body">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main class="dashboard-main">
        <div class="dashboard-topbar">
            <div class="dashboard-topbar-text">
                <h1>Canchas</h1>
                <p>Gestión de canchas del establecimiento</p>
            </div>
        </div>

        <div th:if="${mensajeExito}" class="alert-toast alert-toast--success">
            <i class="bi bi-check-circle"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
        <div th:if="${mensajeError}" class="alert-toast alert-toast--error">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${mensajeError}"></span>
        </div>

        <section class="dashboard-section active">
            <div class="table-wrapper">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Precio/Hora</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cancha : ${canchas}">
                                <td th:text="${cancha.nombre}"></td>
                                <td th:text="${cancha.tipo}"></td>
                                <td th:text="'S/. ' + ${cancha.precioHora}"></td>
                                <td>
                                    <span class="badge-estado" th:classappend="${cancha.disponible} ? 'badge-activo' : 'badge-inactivo'" th:text="${cancha.disponible} ? 'Habilitada' : 'Deshabilitada'"></span>
                                </td>
                                <td>
                                    <button type="button" class="btn-icon btn-editar-cancha" th:data-id="${cancha.id}" th:data-nombre="${cancha.nombre}" th:data-tipo="${cancha.tipo}" th:data-precio="${cancha.precioHora}" th:data-descripcion="${cancha.descripcion}" title="Editar cancha" aria-label="Editar cancha">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    
                                    <!-- Si está disponible: requiere confirmación profesional antes de deshabilitar -->
                                    <button th:if="${cancha.disponible}" type="button" class="btn-icon btn-icon--danger btn-abrir-deshabilitar" th:data-id="${cancha.id}" th:data-nombre="${cancha.nombre}" title="Deshabilitar cancha">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                    
                                    <!-- Si está deshabilitada: botón para habilitar con POST + CSRF -->
                                    <form th:unless="${cancha.disponible}" th:action="@{'/admin/canchas/' + ${cancha.id} + '/estado'}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="disponible" value="true">
                                        <button type="submit" class="btn-icon btn-icon--success" title="Habilitar cancha">
                                            <i class="bi bi-check-circle"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginación estilo maqueta -->
                <div th:replace="~{fragments/pagination :: pager(${courtsPage.number}, ${courtsPage.totalPages}, ${courtsPage.totalElements}, ${courtsPage.size}, '/admin/canchas', 'q', null)}"></div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/modals/modal-cancha :: modal}"></div>
    <div th:replace="~{fragments/modals/modal-cancha :: modal-deshabilitar}"></div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/footer :: scripts}"></div>
    <script th:src="@{/js/core/ajax-form.js}"></script>
    <script th:src="@{/js/admin/canchas.js}"></script>
</body>
</html>
