<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head-dashboard}"></head>
<body class="dashboard-body">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main class="dashboard-main" id="main-content">
        <div class="dashboard-topbar">
            <div class="dashboard-topbar-text">
                <h1>Clientes</h1>
                <p>Busca por DNI, nombres o apellidos. Se muestran hasta 10 coincidencias.</p>
            </div>
            <div>
                <form id="clientSearchForm" class="d-flex gap-2 flex-wrap" novalidate
                      th:data-search-url="@{/admin/api/clientes/buscar}"
                      th:data-clients-url="@{/admin/clientes}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label for="clientSearchCriterion" class="form-label">Buscar por</label>
                        <select id="clientSearchCriterion" class="form-control">
                            <option value="DNI">DNI</option>
                            <option value="NOMBRE">Nombre</option>
                        </select>
                    </div>
                    <div>
                        <label for="clientSearchValue" class="form-label">DNI o nombre</label>
                        <input type="text" id="clientSearchValue" class="form-control" maxlength="8"
                               inputmode="numeric" autocomplete="off" aria-describedby="clientSearchError clientSearchStatus"
                               placeholder="Escribe de 1 a 8 dígitos">
                        <span id="clientSearchError" class="text-danger small d-block" role="alert"></span>
                    </div>
                    <button type="button" id="clearClientSearch" class="btn btn-sm btn-outline-secondary align-self-end">Limpiar</button>
                </form>
            </div>
        </div>

        <section class="dashboard-section active">
            <div class="table-wrapper">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th>
                                <th scope="col">Usuario</th>
                                <th scope="col">Email</th>
                                <th scope="col">Teléfono / Ubicación</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientSearchResults"></tbody>
                    </table>
                </div>

                <p id="clientSearchStatus" class="text-muted small p-3" role="status" aria-live="polite">Escribe un DNI o nombre para buscar.</p>
            </div>
        </section>
    </main>

    <script th:replace="~{fragments/layout :: navbar-js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const toastExito = /*[[${mensajeExito}]]*/ null;
            const toastError = /*[[${mensajeError}]]*/ null;
            if (toastExito && window.FqsToast) {
                window.FqsToast.show(toastExito, 'success');
            } else if (toastError && window.FqsToast) {
                window.FqsToast.show(toastError, 'error');
            }
        });
        /*]]>*/
    </script>
    <script th:src="@{/js/admin/clientes.js}"></script>
</body>
</html>
