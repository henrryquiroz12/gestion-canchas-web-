<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Fredy Queen Soccer</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-search" style="font-size: 3.5rem; color: var(--fqs-primary, #15803D);" aria-hidden="true"></i>
            </div>
            <h1 class="error-title">Error 404</h1>
            <p class="error-text">La página que estás buscando no existe o ha sido movida.</p>
            
            <div class="error-actions">
                <a th:href="@{/inicio}" class="btn btn-primary">Volver al inicio</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
    
    <!-- Scripts -->
    <script th:replace="~{fragments/layout :: navbar-js}"></script>

</body>
</html>
