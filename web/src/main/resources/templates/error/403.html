<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado - Fredy Queen Soccer</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-shield-lock-fill" style="font-size: 3.5rem; color: var(--fqs-danger, #DC2626);" aria-hidden="true"></i>
            </div>
            <h1 class="error-title">Acceso Denegado</h1>
            <p class="error-text">Lo sentimos, no tienes los permisos necesarios para acceder a esta sección.</p>
            
            <div class="error-actions">
                <a th:href="@{/inicio}" class="btn btn-outline">Volver al inicio</a>
                <a href="javascript:history.back()" class="btn btn-primary">Regresar</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
    
    <!-- Scripts -->
    <script th:replace="~{fragments/layout :: navbar-js}"></script>

</body>
</html>
